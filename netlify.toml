# =============================================================================
# Netlify Configuration - Nexaouraa Consultancy Platform
# Custom Vanilla Node.js / Python Multi-Page Architecture
# =============================================================================

[build]
  # Master build command that compiles all 6 static pages
  command = "python scripts/build_pages.py"
  # Root directory containing final static HTML pages, assets, docs, and images
  publish = "."
  # Netlify Serverless Functions directory
  functions = "netlify/functions"

[dev]
  # Explicitly tell Netlify CLI to use custom mode (stops Hydrogen/Remix misdetection)
  framework = "#custom"
  # Local development command (runs scripts/serve.js)
  command = "npm run dev"
  # Target port where scripts/serve.js listens
  targetPort = 3000
  # Netlify Dev local proxy port
  port = 8888
  # Static asset directory
  publish = "."

[functions]
  # Fast, reliable esbuild bundling for serverless functions
  node_bundler = "esbuild"

# Chatbot API Proxy: Redirects POST /api/chat to the Netlify serverless function
# without modifying browser URLs or impacting any static routes.
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200
  force = true

# HTTP Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
